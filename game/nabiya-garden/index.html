<!doctype html>
<!--
  나비야 정원 — 센서 악기 합주 리듬 확인 화면
  버전 기록
  v1.0 — 나비야 정원 원샷 빌드
  v1.0.1 — 배경 그림을 세 조각으로 자르지 않고 노트 영역(x 240~1440, y 100~746)에 한 장으로 그림, 행 사이 틈은 얇은 반투명 선 (요청목록 8번)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나비야 정원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #2b2a33; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #fffaf0; }
  .panel { position: fixed; right: 16px; bottom: 16px; width: min(560px, calc(100vw - 32px)); box-sizing: border-box;
    padding: 14px; border-radius: 14px; background: #fffaf0; color: #2b2a33; box-shadow: 0 8px 30px rgba(0,0,0,.35);
    font: 14px/1.4 'Gowun Dodum', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; display: none; }
  .panel.open { display: block; }
  .panel h2 { margin: 0 0 6px; font-size: 16px; }
  .panel textarea { width: 100%; height: 150px; box-sizing: border-box; font: 12px/1.4 ui-monospace, Consolas, monospace;
    border: 2px solid #efe3c8; border-radius: 8px; padding: 8px; resize: vertical; background: #fff; color: #2b2a33; }
  .panel .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .panel button { height: 34px; padding: 0 14px; border-radius: 8px; border: 2px solid #2b2a33; background: #2b2a33; color: #fffaf0;
    font: inherit; font-weight: 700; cursor: pointer; }
  .panel button.ghost { background: #fffaf0; color: #2b2a33; }
  .panel pre { margin: 8px 0 0; max-height: 110px; overflow: auto; font: 11px/1.4 ui-monospace, Consolas, monospace; color: #5d5a66;
    background: #f6edda; border-radius: 8px; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1440" height="810" aria-label="나비야 정원 게임 화면"></canvas></div>

<div class="panel" id="logPanel" role="dialog" aria-label="로그 재생">
  <h2>로그 재생 (L 키로 여닫기)</h2>
  <label for="logText">시리얼 줄이나 결과 CSV를 붙여넣고 재생을 누르면, 시리얼로 들어온 것처럼 다시 보여 줍니다.</label>
  <textarea id="logText" spellcheck="false" placeholder="MODE,DMA_ON&#10;BEAT,0&#10;W,ON,SOL,72,0,+12&#10;D,ON,KICK,88,0,-3"></textarea>
  <div class="row">
    <button id="logPlay" type="button">재생</button>
    <button id="logClose" type="button" class="ghost">닫기</button>
    <span id="logInfo"></span>
  </div>
  <pre id="logLines" aria-label="최근 받은 줄"></pre>
</div>

<div class="panel" id="csvPanel" role="dialog" aria-label="기록 CSV">
  <h2>기록 CSV</h2>
  <label for="csvText">클립보드 복사가 막혀 있어 여기에 표시합니다. 전체 선택해서 복사하세요.</label>
  <textarea id="csvText" spellcheck="false" readonly></textarea>
  <div class="row"><button id="csvClose" type="button" class="ghost">닫기</button></div>
</div>

<script src="assets/manifest.js"></script>
<script>
'use strict';
/* ============================================================================
   CONFIG — 실제 하드웨어로 해 본 뒤 바꿀 숫자는 여기만 고치면 된다
   ========================================================================== */
const CONFIG = {
  version: 'v1.0.1',
  // 판정 창(ms). 키보드 모드 판정과, 시리얼 줄에 등급 칸이 없을 때의 분류에 쓴다. 템포와 무관하게 ms 고정.
  judgeMs: { default: { P: 50, G: 120, B: 250 }, W: { P: 100, G: 200, B: 400 } },
  score: { P: 100, G: 70, B: 30, M: 0 },          // 음 틀림은 Bad 점수
  ranks: [['만개', 90], ['개화', 75], ['새싹', 50], ['씨앗', 0]],   // 정확도 % 이상
  tempos: [70, 80, 90, 100, 110],
  defaultTempo: 90,
  pxPerBeat: 110,                                  // 1박 = 110px (템포가 바뀌면 흐르는 속도만 바뀜)
  countInBeats: 4,
  tailBeats: 1.5,                                  // 마지막 박 뒤 결과 화면까지 여유
  ensembleMs: 50,                                  // 합주 일치: 같은 박 오차의 최대-최소
  roundMs: 5,                                      // 쏠림·흔들림 표시 단위
  tempoWarnPct: 10,                                // Uno 실제 BPM이 고른 값과 이만큼 넘게 다르면 경고
  maxPorts: 4,
  baudRate: 115200,
  serialMissGraceMs: 300,                          // 시리얼·로그 재생: 판정 창 뒤 이만큼 더 기다린 뒤 Miss 표시
  fxMs: 600,                                       // 판정 글자 표시 시간
  rowColors: { W: '#f7a8c4', H: '#c9b6f2', D: '#ffffff' },     // 행별 꽃 색 (분홍, 연보라, 흰색)
  instColors: { W: '#3f6fc8', H: '#c98a00', D: '#c2456b' },
  assetDir: 'assets/',
};

/* ============================================================================
   채보 — 나비야 16마디 (괄호 숫자 = 박 수)
   ========================================================================== */
const BARS = [
  ['솔1 미1 미2', 'C'], ['파1 레1 레2', 'G7'], ['도1 레1 미1 파1', 'C'], ['솔1 솔1 솔2', 'C'],
  ['솔1 미1 미1 미1', 'C'], ['파1 레1 레2', 'G7'], ['도1 미1 솔1 솔1', 'C'], ['미1 미1 미2', 'C'],
  ['레1 레1 레1 레1', 'G7'], ['레1 미1 파2', 'G7'], ['미1 미1 미1 미1', 'C'], ['미1 파1 솔2', 'C'],
  ['솔1 미1 미2', 'C'], ['파1 레1 레2', 'G7'], ['도1 미1 솔1 솔1', 'C'], ['미1 미1 미2', 'C'],
];
const DRUM_BAR = '쿵1 짝1 쿵1 짝1';
const DRUM_LAST_BAR = '쿵1 짝1 쿵2';
const CHORDS = { C: ['도', '미'], G7: ['솔', '레'] };       // 하프: 1박, 3박
const K2E = { 도: 'DO', 레: 'RE', 미: 'MI', 파: 'FA', 솔: 'SOL', 쿵: 'KICK', 짝: 'SNARE' };
const KO = { DO: '도', RE: '레', MI: '미', FA: '파', SOL: '솔', KICK: '쿵', SNARE: '짝' };
const INSTS = ['W', 'H', 'D'];
const INST_NAME = { W: '관악기', H: '하프', D: '드럼' };
const VALID_PITCH = { W: ['DO', 'RE', 'MI', 'FA', 'SOL'], H: ['DO', 'RE', 'MI', 'FA', 'SOL'], D: ['KICK', 'SNARE'] };
const TOTAL_BEATS = BARS.length * 4;

function buildChart() {
  const notes = [], problems = [];
  const add = (inst, beat, len, pitch) => notes.push({
    inst, beat, len, pitch, grade: null, offset: null, wrong: false, played: null, vel: null,
    judgedBeat: null, heldUntil: null, auto: false,
  });
  BARS.forEach(([melody, chord], bi) => {
    const b0 = bi * 4;
    let sum = 0;
    melody.split(' ').forEach(tok => { const len = Number(tok.slice(1)); add('W', b0 + sum, len, K2E[tok[0]]); sum += len; });
    if (sum !== 4) problems.push((bi + 1) + '마디 관악기 박 합 ' + sum);
    CHORDS[chord].forEach((p, i) => add('H', b0 + i * 2, 2, K2E[p]));
    let ds = 0;
    (bi === BARS.length - 1 ? DRUM_LAST_BAR : DRUM_BAR).split(' ').forEach(tok => {
      const len = Number(tok.slice(1)); add('D', b0 + ds, len, K2E[tok[0]]); ds += len;
    });
    if (ds !== 4) problems.push((bi + 1) + '마디 드럼 박 합 ' + ds);
  });
  notes.sort((a, b) => a.beat - b.beat || INSTS.indexOf(a.inst) - INSTS.indexOf(b.inst));
  notes.forEach((n, i) => { n.id = i; });
  const groups = new Map();
  notes.forEach(n => { if (!groups.has(n.beat)) groups.set(n.beat, []); groups.get(n.beat).push(n); });
  const ensemble = [...groups.entries()].filter(([, ns]) => ns.length >= 2).map(([beat, ns]) => ({ beat, notes: ns, fired: false }));
  return { notes, problems, ensemble };
}

/* ============================================================================
   상태
   ========================================================================== */
const W = 1440, H = 810, ROW_H = 210, LANE_X = 240, LINE_X = 300;
const ROW_Y = { W: 100, H: 318, D: 536 };
const G = {
  screen: 'title',            // title | play | result
  inputMode: 'keyboard',      // 시작 화면에서 고른 입력 방식: keyboard | serial
  source: 'keyboard',         // 이번 판 판정 입력원: keyboard | serial | auto | demo | replay
  tempo: CONFIG.defaultTempo,
  label: 'DMA_ON',
  notes: [], ensemble: [], strays: [],
  beatMs: 60000 / CONFIG.defaultTempo, anchorBeat: 0, anchorTime: 0,
  waitingUno: false, lastBeatN: -1, lastBeatT: null, measBeatMs: null, beatCount: 0,
  queue: [],                  // 자동 연주·데모·로그 재생용 예약 이벤트
  stats: null, lastSummary: null, runs: {},
  judgeFx: {}, sits: [], particles: [], stringFx: {}, pollen: null, flower: {},
  meters: { W: 0, D: 0 }, holdKey: false,
  rawLog: [], ignored: 0, lastIgnored: '',
  status: '', statusAt: 0,
  hits: [], hover: null,
  sim: false, simNow: 0,
  frames: 0, fps: 0, lastFrameT: 0,
};
const now = () => (G.sim ? G.simNow : performance.now());
const songBeat = (t) => G.anchorBeat + ((t === undefined ? now() : t) - G.anchorTime) / G.beatMs;
const win = (inst) => CONFIG.judgeMs[inst] || CONFIG.judgeMs.default;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round5 = (v) => Math.round(v / CONFIG.roundMs) * CONFIG.roundMs;
const sgn = (v) => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v);
function mulberry32(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function setStatus(msg) { G.status = msg; G.statusAt = now(); }

/* ============================================================================
   판정 → 화면 상태. 화면 상태는 applyJudgment 하나로만 바뀐다.
   note === null 이면 헛음(노트 없는 자리의 입력).
   ========================================================================== */
function applyJudgment(note, grade, offsetMs, extra) {
  extra = extra || {};
  const t = now(), b = songBeat();
  if (!note) {
    const inst = extra.inst;
    G.strays.push({ inst, beat: b, offset: offsetMs, played: extra.played || null });
    G.judgeFx[inst] = { text: '헛음', sub: '노트 없는 자리', color: '#5d5a66', at: t };
    for (let i = 0; i < 3; i++) spawn(LINE_X + 20 + Math.random() * 30, ROW_Y[inst] + 90, (Math.random() - .5) * .05, .05 + Math.random() * .05, 900, CONFIG.rowColors[inst] === '#ffffff' ? '#f3ead6' : CONFIG.rowColors[inst], 7, 'petal');
    if (extra.vel != null && G.meters[inst] !== undefined) G.meters[inst] = extra.vel;
    recompute();
    return;
  }
  const wrong = !!extra.wrong && grade !== 'M';
  if (wrong) grade = 'B';                          // 음 틀림 = Bad
  note.grade = grade; note.offset = grade === 'M' ? null : offsetMs; note.wrong = wrong;
  note.played = grade === 'M' ? null : (extra.played || note.pitch);
  note.vel = extra.vel == null ? null : extra.vel;
  note.judgedBeat = b; note.auto = !!extra.auto; note.heldUntil = null;
  const inst = note.inst, row = ROW_Y[inst], cy = row + ROW_H / 2;
  if (grade !== 'M') {
    G.flower[inst] = { stage: grade === 'P' ? 'full' : grade === 'G' ? 'half' : 'wilted', at: t };
    G.sits.push({ inst, pitch: note.played, at: t, grade, wrong });
    if (note.vel != null && G.meters[inst] !== undefined) G.meters[inst] = note.vel;
    if (inst === 'H') G.stringFx[note.played] = { at: t, color: wrong ? '#7a3fc4' : grade === 'P' ? '#ffcf3a' : grade === 'G' ? '#cfd6de' : '#b9a98a' };
  }
  const offTxt = offsetMs == null ? '' : sgn(Math.round(offsetMs)) + 'ms';
  if (wrong) {
    G.judgeFx[inst] = { text: '음 틀림', sub: KO[note.pitch] + ' 자리에 ' + KO[note.played] + ' · Bad 처리', color: '#7a3fc4', at: t };
  } else if (grade === 'M') {
    G.judgeFx[inst] = { text: 'MISS', sub: KO[note.pitch] + ' · 감지 안 됨', color: '#5d5a66', at: t };
  } else {
    const name = { P: 'PERFECT', G: 'GOOD', B: 'BAD' }[grade], col = { P: '#8a5a00', G: '#24724a', B: '#b24a24' }[grade];
    G.judgeFx[inst] = { text: name, sub: offTxt + ' · ' + KO[note.played], color: col, at: t };
  }
  if (grade === 'P') for (let i = 0; i < 10; i++) { const a = Math.random() * Math.PI * 2, s = .08 + Math.random() * .16; spawn(LINE_X, cy, Math.cos(a) * s, Math.sin(a) * s, 500 + Math.random() * 300, '#ffd34d', 3 + Math.random() * 3, 'spark'); }
  if (grade === 'G') for (let i = 0; i < 4; i++) { const a = Math.random() * Math.PI * 2; spawn(LINE_X, cy, Math.cos(a) * .1, Math.sin(a) * .1, 450, '#bfe6c9', 3, 'spark'); }
  // 합주 일치: 같은 박의 노트가 모두 감지되고 오차 폭이 기준 안
  const grp = G.ensemble.find(g => g.beat === note.beat);
  if (grp && !grp.fired && grp.notes.every(n => n.grade && n.grade !== 'M')) {
    const offs = grp.notes.map(n => n.offset || 0), spread = Math.max(...offs) - Math.min(...offs);
    if (spread <= CONFIG.ensembleMs) {
      grp.fired = true;
      const half = Math.round(spread / 2);
      G.pollen = { at: t, half, beat: note.beat };
      for (let i = 0; i < 46; i++) spawn(LINE_X - 14 + Math.random() * 28, 100 + Math.random() * 646, (Math.random() - .3) * .08, -.02 - Math.random() * .05, 800 + Math.random() * 500, i % 3 ? '#ffe27a' : '#fff6c9', 2 + Math.random() * 3, 'spark');
    }
  }
  recompute();
}
function spawn(x, y, vx, vy, life, color, size, type) {
  if (G.sim) return;                               // 빠른 시뮬레이션에서는 연출 입자를 만들지 않는다
  if (G.particles.length > 400) G.particles.shift();
  G.particles.push({ x, y, vx, vy, life, max: life, color, size, type });
}

/* 통계는 노트 목록에서 매번 새로 계산한다(149개라 가볍다) */
function recompute() {
  const per = {}; INSTS.forEach(i => { per[i] = { P: 0, G: 0, B: 0, M: 0, wrong: 0, total: 0, offs: [] }; });
  let score = 0, judged = 0, combo = 0, maxCombo = 0;
  const allOffs = [];
  for (const n of G.notes) {
    const p = per[n.inst]; p.total++;
    if (!n.grade) continue;
    judged++; p[n.grade]++; score += CONFIG.score[n.grade];
    if (n.wrong) p.wrong++;
    if (n.grade !== 'M') { p.offs.push(n.offset || 0); allOffs.push(n.offset || 0); }
    if ((n.grade === 'P' || n.grade === 'G') && !n.wrong) { combo++; if (combo > maxCombo) maxCombo = combo; } else combo = 0;
  }
  const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
  const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / a.length); };
  INSTS.forEach(i => {
    const p = per[i], det = p.P + p.G + p.B;
    p.detected = det; p.bias = mean(p.offs); p.jitter = sd(p.offs);
    p.pitchAcc = det ? (det - p.wrong) / det * 100 : null;
  });
  const done = G.ensemble.filter(g => g.notes.every(n => n.grade));
  const cnt = k => INSTS.reduce((s, i) => s + per[i][k], 0);
  G.stats = {
    per, score, judged, combo, maxCombo, max: G.notes.length * CONFIG.score.P,
    acc: judged ? score / (judged * CONFIG.score.P) * 100 : 0,
    bias: mean(allOffs), jitter: sd(allOffs), strays: G.strays.length,
    ensembleHit: G.ensemble.filter(g => g.fired).length, ensembleDone: done.length, ensembleTotal: G.ensemble.length,
    P: cnt('P'), Gd: cnt('G'), B: cnt('B'), M: cnt('M'), detected: allOffs.length,
  };
}

/* ============================================================================
   판 시작·끝
   ========================================================================== */
function startGame(source, opts) {
  opts = opts || {};
  const c = buildChart();
  G.notes = c.notes; G.ensemble = c.ensemble; G.strays = [];
  G.source = source; G.screen = 'play';
  if (opts.tempo) G.tempo = opts.tempo;
  G.beatMs = 60000 / G.tempo;
  G.anchorBeat = -CONFIG.countInBeats; G.anchorTime = now();
  G.waitingUno = source === 'serial';
  G.lastBeatN = -1; G.lastBeatT = null; G.measBeatMs = null; G.beatCount = 0;
  G.queue = []; G.judgeFx = {}; G.sits = []; G.particles = []; G.stringFx = {}; G.pollen = null; G.flower = {};
  G.meters = { W: 0, D: 0 }; G.holdKey = false; G.ignored = 0; G.lastIgnored = '';
  recompute();
  if (source === 'auto') planAuto();
  if (source === 'demo') planDemo(opts.seed || 20261118);
  if (source === 'replay') planReplay(opts.lines || []);
  G.queue.sort((a, b) => a.beat - b.beat);
}
function planAuto() {
  for (const n of G.notes) {
    G.queue.push({ beat: n.beat, fn: () => applyJudgment(n, 'P', 0, { vel: n.inst === 'H' ? 0 : 78, played: n.pitch }) });
    if (n.inst === 'W') G.queue.push({ beat: n.beat + n.len - 0.12, fn: () => { n.heldUntil = n.beat + n.len - 0.12; G.meters.W = 0; } });
  }
}
function planDemo(seed) {
  const r = mulberry32(seed);
  for (const n of G.notes) {
    const w = win(n.inst), u = r(), vel = n.inst === 'H' ? 0 : 45 + Math.round(r() * 55);
    const dir = r() < 0.6 ? 1 : -1;
    let grade, off, wrong = false;
    if (u < 0.60) { grade = 'P'; off = dir * r() * w.P * 0.9; }
    else if (u < 0.78) { grade = 'G'; off = dir * (w.P + r() * (w.G - w.P)); }
    else if (u < 0.86) { grade = 'B'; off = dir * (w.G + r() * (w.B - w.G) * 0.8); }
    else if (u < 0.93) { grade = 'B'; off = dir * r() * w.P; wrong = true; }
    else continue;                                  // Miss: 이벤트가 오지 않음
    off = Math.round(off);
    const opts = VALID_PITCH[n.inst].filter(p => p !== n.pitch && !(n.inst === 'H' && p === 'FA'));
    const played = wrong ? opts[Math.floor(r() * opts.length)] : n.pitch;
    G.queue.push({ beat: n.beat + off / G.beatMs, fn: () => applyJudgment(n, grade, off, { vel, played, wrong }) });
    if (n.inst === 'W') { const hold = n.len * (0.55 + r() * 0.4); G.queue.push({ beat: n.beat + hold, fn: () => { if (n.grade && n.grade !== 'M') n.heldUntil = n.beat + hold; G.meters.W = 0; } }); }
  }
  for (let i = 0; i < 5; i++) {
    const inst = INSTS[Math.floor(r() * 3)], beat = Math.floor(r() * (TOTAL_BEATS - 2)) + 0.5;
    G.queue.push({ beat, fn: () => applyJudgment(null, 'X', null, { inst, vel: 40 }) });
  }
}
function finish() {
  const s = G.stats, per = {};
  INSTS.forEach(i => { const p = s.per[i]; per[i] = { P: p.P, G: p.G, B: p.B, M: p.M, wrong: p.wrong, total: p.total, pitchAcc: p.pitchAcc, bias: p.bias, jitter: p.jitter }; });
  const accPct = s.max ? s.score / s.max * 100 : 0;
  const rank = CONFIG.ranks.find(r => accPct >= r[1])[0];
  G.lastSummary = {
    label: G.label, tempo: G.tempo, source: G.source, score: s.score, max: s.max, accPct, rank,
    detected: s.detected, total: G.notes.length, maxCombo: s.maxCombo, P: s.P, Gd: s.Gd, B: s.B, M: s.M,
    bias: s.bias, jitter: s.jitter, strays: s.strays, ensembleHit: s.ensembleHit, ensembleTotal: s.ensembleTotal,
    per, measuredBpm: G.measBeatMs ? 60000 / G.measBeatMs : null, csv: buildCSV(),
  };

  text('나비야', 32, 20, 34, INK, { jua: true });
  const where = G.waitingUno ? 'Uno 박자 대기' : b < 0 ? '카운트' : (Math.min(16, Math.floor(b / 4) + 1)) + '마디 ' + (Math.floor(((b % 4) + 4) % 4) + 1) + '박';
  text('16마디 · ' + G.tempo + ' BPM · ' + where, 32, 60, 14, SUB);
  const bx = 272, bw = 430, frac = clamp(b / TOTAL_BEATS, 0, 1);
  rr(bx, 34, bw, 10, 5, LINE); if (frac > 0) rr(bx, 34, Math.max(10, bw * frac), 10, 5, '#8cc66f');
  drawButterfly(bx + bw * frac, 38, 30, 'SOL', { flap: Math.abs(Math.sin(t / 140)) });
  ['1마디', '5', '9', '13', '16마디'].forEach((lab, i) => text(lab, bx + bw * i / 4, 52, 12, SUB, { align: i === 0 ? 'left' : i === 4 ? 'right' : 'center' }));
  let cx = 730;
  cx += pill('입력 · ' + SRC_LABEL[G.source], cx, 16, 14, '#e7f0fb', '#23497f') + 8;
  pill(G.label.replace('_', ' '), cx, 16, 14, INK, PAPER);
  if (G.source === 'serial') {
    const meas = G.measBeatMs ? 60000 / G.measBeatMs : null;
    const warn = meas && Math.abs(meas - G.tempo) / G.tempo * 100 > CONFIG.tempoWarnPct;
    pill(meas ? 'Uno 실제 ' + Math.round(meas) + ' BPM' + (warn ? ' · 고른 ' + G.tempo + '과 다름' : '') : (G.beatCount ? 'Uno 박자 받는 중' : 'Uno 박자 아직 없음'), 730, 52, 13, warn ? '#f6dcd2' : '#dff0d8', warn ? '#8a3415' : '#1f5b3a', { padY: 5 });
  } else text('Esc 중단', 730, 58, 13, SUB);
  [['점수', s.score.toLocaleString('en-US'), 1150], ['정확도', (s.judged ? s.acc.toFixed(1) : '0.0') + '%', 1290], ['콤보', String(s.combo), 1408]].forEach(v => {
    text(v[0], v[2], 18, 13, SUB, { align: 'right' }); text(v[1], v[2], 38, 30, INK, { jua: true, align: 'right' });
  });

  // 하단 바: 보여주기만 하는 지표
  ctx.fillStyle = INK; ctx.fillRect(0, 754, W, 56);
  const bias = round5(s.bias), jit = round5(s.jitter);
  let hx = 32;
  hx += text('표시만', hx, 782, 15, PAPER, { bold: true, base: 'middle' }) + 28;
  hx += text('쏠림 ' + sgn(bias) + 'ms' + (bias > 0 ? ' (조금 늦음)' : bias < 0 ? ' (조금 빠름)' : ''), hx, 782, 15, PAPER, { base: 'middle' }) + 28;
  hx += text('흔들림 ±' + jit + 'ms', hx, 782, 15, PAPER, { base: 'middle' }) + 28;
  hx += text('헛음 ' + s.strays, hx, 782, 15, PAPER, { base: 'middle' }) + 28;
  text('합주 일치 ' + s.ensembleHit + '/' + s.ensembleDone + '박', hx, 782, 15, PAPER, { base: 'middle' });
  const right = G.ignored ? '무시한 줄 ' + G.ignored + ' · ' + G.lastIgnored : (G.source === 'keyboard' ? 'Shift+키 = 음 틀림 흉내 · A를 누르고 있으면 유지' : 'L 로그');
  text(right, W - 32, 782, 13, '#c9c4b4', { align: 'right', base: 'middle' });

  // 카운트
  if (G.waitingUno) {
    rr(560, 330, 640, 150, 24, 'rgba(43,42,51,.86)');
    text('Uno 박자를 기다리는 중', 880, 372, 34, PAPER, { jua: true, align: 'center', base: 'middle' });
    text('BEAT 줄이 오면 그 박에 맞춰 시작합니다 · Space를 누르면 화면 시계로 바로 시작', 880, 430, 15, '#e9e4d4', { align: 'center', base: 'middle' });
  } else if (b < 0) {
    const n = Math.ceil(-b), k = 1 - (b - Math.floor(b));
    ctx.globalAlpha = clamp(k * 1.6, 0, 1);
    text(String(n), 870, 405, 190 + 40 * k, INK, { jua: true, align: 'center', base: 'middle', halo: 'rgba(255,250,240,.9)', haloW: 14 });
    ctx.globalAlpha = 1;
  }
}

/* ---------------- 결과 화면 ---------------- */
function drawResult(t) {
  const r = G.lastSummary;
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  // 왼쪽 위: 정원
  ctx.save(); ctx.beginPath(); ctx.roundRect(40, 40, 860, 300, 24); ctx.clip();
  if (IMG.result_garden) cover(IMG.result_garden, 40, 40, 860, 300, IMG.result_garden.naturalWidth, IMG.result_garden.naturalHeight);
  else {
    const g = ctx.createLinearGradient(0, 40, 0, 340); g.addColorStop(0, '#cfe8f6'); g.addColorStop(.55, '#fff3d2'); g.addColorStop(.75, '#a9d48c'); g.addColorStop(1, '#8bbd6b');
    ctx.fillStyle = g; ctx.fillRect(40, 40, 860, 300);
    const colors = ['#f7a8c4', '#c9b6f2', '#ffffff', '#ffb48a', '#9fd3f2'], bloom = Math.round((r.P + r.Gd) / r.total * 26);
    for (let i = 0; i < 26; i++) drawFlower(40 + 396 + (i * 97) % 440, 40 + 214 + (i * 37) % 64, 26 + (i * 13) % 22, colors[i % 5], i < bloom ? 'full' : 'bud');
  }
  ctx.restore();
  const srcTxt = { keyboard: '키보드 입력', serial: 'STM32 입력', auto: '자동 연주', demo: '무작위 데모', replay: '로그 재생' }[r.source];
  text(r.label.replace('_', ' ') + ' 판 · ' + srcTxt + ' · ' + r.tempo + ' BPM', 72, 66, 16, '#23497f', { bold: true, halo: 'rgba(255,250,240,.8)', haloW: 4 });
  const rw = text(r.rank, 72, 92, 96, INK, { jua: true, halo: 'rgba(255,250,240,.8)', haloW: 8 });
  const sw = text(r.score.toLocaleString('en-US'), 72 + rw + 18, 140, 40, INK, { jua: true, halo: 'rgba(255,250,240,.8)', haloW: 6 });
  text('/ ' + r.max.toLocaleString('en-US'), 72 + rw + 18 + sw + 8, 156, 22, SUB, { jua: true, halo: 'rgba(255,250,240,.8)', haloW: 5 });
  text('정확도 ' + r.accPct.toFixed(1) + '% · ' + r.total + '음 중 ' + r.detected + '음 감지 · Perfect ' + r.P + ' · 최대 콤보 ' + r.maxCombo, 72, 204, 17, INK, { halo: 'rgba(255,250,240,.85)', haloW: 5 });
  if (r.measuredBpm) text('Uno 실제 박자 ' + Math.round(r.measuredBpm) + ' BPM', 72, 232, 14, SUB, { halo: 'rgba(255,250,240,.85)', haloW: 4 });

  // 왼쪽 아래: 악기별 표
  const tx = 40, ty = 364, tw = 860, cols = [56, 300, 380, 460, 540, 650, 752, 844];
  rr(tx, ty, tw, 292, 20, PAPER, LINE, 2);
  ctx.save(); ctx.beginPath(); ctx.roundRect(tx + 1, ty + 1, tw - 2, 290, 19); ctx.clip();
  ctx.fillStyle = '#f6edda'; ctx.fillRect(tx, ty, tw, 46);
  ctx.restore();
  [['악기', INK], ['Perfect', '#8a5a00'], ['Good', '#24724a'], ['Bad', '#b24a24'], ['Miss', SUB], ['음 정확도', INK], ['쏠림', INK], ['흔들림', INK]].forEach((h, i) =>
    text(h[0], cols[i], ty + 23, 16, h[1], { bold: true, base: 'middle', align: i ? 'right' : 'left' }));
  let worst = null;
  INSTS.forEach((inst, i) => {
    const p = r.per[inst], y = ty + 46 + i * 62;
    ctx.fillStyle = LINE; ctx.fillRect(tx, y, tw, 1);
    ctx.fillStyle = CONFIG.instColors[inst]; ctx.beginPath(); ctx.arc(62, y + 31, 6, 0, Math.PI * 2); ctx.fill();
    text(INST_NAME[inst], 78, y + 32, 20, INK, { jua: true, base: 'middle' });
    const bias = round5(p.bias), jit = round5(p.jitter);
    const vals = [p.P, p.G, p.B, p.M, p.pitchAcc == null ? '—' : Math.round(p.pitchAcc) + '%', sgn(bias) + 'ms' + (bias >= 20 ? ' 늦음' : bias <= -20 ? ' 빠름' : ''), '±' + jit + 'ms'];
    vals.forEach((v, k) => text(String(v), cols[k + 1], y + 32, 16, INK, { base: 'middle', align: 'right' }));
    if (Math.abs(bias) >= 20 && (!worst || Math.abs(bias) > Math.abs(worst.bias))) worst = { inst, bias };
  });
  ctx.fillStyle = LINE; ctx.fillRect(tx, ty + 232, tw, 1);
  const hint = worst ? INST_NAME[worst.inst] + '가 평균 ' + Math.abs(worst.bias) + 'ms ' + (worst.bias > 0 ? '늦음' : '빠름') + (worst.inst === 'W' && worst.bias > 0 ? ' → 입김 감지 고정 지연을 빼면 개선' : '') + ' (쏠림·흔들림은 5ms 단위 대략값, 표시만 하는 지표)'
    : '쏠림·흔들림은 5ms 단위 대략값 · 점수에는 넣지 않고 보여주기만 함 · 헛음 ' + r.strays + '회';
  text(hint, tx + 16, ty + 262, 14, SUB, { base: 'middle' });
  text('L 로그 재생 · T 자동 연주 · R 무작위 데모 · Esc 시작 화면', tx, 690, 13, SUB);
  if (G.status && now() - G.statusAt < 4000) text(G.status, tx, 716, 14, '#24724a', { bold: true });

  // 오른쪽: DMA ON / OFF 비교
  const px = 932, pw = 468;
  rr(px, 40, pw, 730, 24, INK);
  const on = G.runs.DMA_ON, off = G.runs.DMA_OFF, both = on && off;
  let head = 'DMA ON vs OFF 비교', subh = '같은 곡을 DMA ON 한 판, OFF(폴링) 한 판';
  if (both) head = on.M < off.M ? 'DMA가 놓친 박을 줄였다' : on.M > off.M ? 'DMA ON 쪽 Miss가 더 많다' : 'Miss 수는 같다';
  else subh = '다른 판을 해보세요 · 시작 화면에서 ' + (on ? 'DMA OFF' : 'DMA ON') + '로 바꿔 한 판 더';
  text(head, px + 28, 66, 30, PAPER, { jua: true });
  text(subh, px + 28, 108, 14, '#c9c4b4');
  if (both && on.tempo !== off.tempo) pill('템포가 달라요 · ON ' + on.tempo + ' / OFF ' + off.tempo + ' BPM', px + 28, 132, 13, '#f08a6b', INK, { padY: 5 });
  const rows = [
    ['Miss (감지 안 됨)', x => x.M, '회', true], ['Bad (박자에서 멂 · 음 틀림 포함)', x => x.B, '회', true],
    ['흔들림 (오차 표준편차)', x => round5(x.jitter), 'ms', true], ['합주 일치 박 (' + (r.ensembleTotal) + '박 중)', x => x.ensembleHit, '박', false],
  ];
  rows.forEach((row, i) => {
    const y = 176 + i * 106, a = on ? row[1](on) : null, bb = off ? row[1](off) : null, max = Math.max(a || 0, bb || 0, 1);
    text(row[0], px + 28, y, 16, PAPER, { bold: true });
    [['DMA ON', a, '#8cc66f'], ['OFF', bb, '#f08a6b']].forEach((v, k) => {
      const by = y + 30 + k * 32;
      text(v[0], px + 28, by + 11, 14, PAPER, { base: 'middle' });
      rr(px + 100, by, 250, 22, 11, 'rgba(255,250,240,.12)');
      if (v[1] != null && v[1] > 0) rr(px + 100, by, Math.max(22, 250 * v[1] / max), 22, 11, v[2]);
      text(v[1] == null ? '아직 없음' : v[1] + row[2], px + pw - 28, by + 11, v[1] == null ? 13 : 17, v[1] == null ? '#c9c4b4' : PAPER, { bold: v[1] != null, align: 'right', base: 'middle' });
    });
  });
  text('막대가 길수록 값이 큼 · 합주 일치는 클수록 좋음', px + 28, 612, 13, '#c9c4b4');
  button('다시 (Space)', px + 28, 690, 200, 52, { r: 14, size: 20, bg: '#ffe27a', border: null, fn: () => startFromTitle() });
  button('기록 CSV 복사', px + 240, 690, 200, 52, { r: 14, size: 20, bg: INK, fg: PAPER, border: PAPER, fn: () => copyCSV() });
  button('시작 화면', px + 28, 640, 412, 40, { r: 12, size: 16, bg: INK, fg: PAPER, border: 'rgba(255,250,240,.4)', fn: () => { G.screen = 'title'; } });
}
function copyCSV() {
  const csv = G.lastSummary ? G.lastSummary.csv : '';
  const fallback = () => { const p = document.getElementById('csvPanel'), ta = document.getElementById('csvText'); ta.value = csv; p.classList.add('open'); ta.focus(); ta.select(); };
  try { navigator.clipboard.writeText(csv).then(() => setStatus('기록 CSV를 클립보드에 복사했습니다'), fallback); } catch (e) { fallback(); }
}

/* ============================================================================
   그리기 루프
   ========================================================================== */
function draw() {
  const t = now();
  G.hits = [];
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  if (G.screen === 'title') drawTitle(t); else if (G.screen === 'play') drawPlay(t); else drawResult(t);
}
function frame(ts) {
  if (G.lastFrameT) { const d = ts - G.lastFrameT; if (d > 0) G.fps = G.fps ? G.fps * 0.9 + (1000 / d) * 0.1 : 1000 / d; }
  G.lastFrameT = ts; G.frames++;
  if (!G.sim) update();
  draw();
  requestAnimationFrame(frame);
}

/* ============================================================================
   키·마우스
   ========================================================================== */
const KEY_INST = { KeyA: 'W', KeyS: 'H', KeyD: 'D' };
function inField(e) { const tg = e.target; return tg && (tg.tagName === 'TEXTAREA' || tg.tagName === 'INPUT'); }
window.addEventListener('keydown', (e) => {
  if (e.code === 'Escape') { closePanels(); if (G.screen !== 'title' && !inField(e)) G.screen = 'title'; return; }
  if (inField(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'KeyL') { togglePanel('logPanel'); e.preventDefault(); return; }
  if (e.code === 'KeyT') { startGame('auto'); return; }
  if (e.code === 'KeyR') { startGame('demo', { seed: Math.floor(performance.now()) }); return; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (G.screen === 'play') { if (G.waitingUno) { G.waitingUno = false; G.anchorBeat = -CONFIG.countInBeats; G.anchorTime = now(); } }
    else startFromTitle();
    return;
  }
  if (G.screen === 'title') { if (e.code === 'ArrowLeft') stepTempo(-1); if (e.code === 'ArrowRight') stepTempo(1); return; }
  const inst = KEY_INST[e.code];
  if (inst && !e.repeat && G.screen === 'play') {
    if (inst === 'W') G.holdKey = true;
    keyHit(inst, G.sim ? G.simNow : e.timeStamp, e.shiftKey);
  }
});
window.addEventListener('keyup', (e) => { if (e.code === 'KeyA' && G.screen === 'play' && G.source === 'keyboard') keyRelease(G.sim ? G.simNow : e.timeStamp); });
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function findHit(p) { for (let i = G.hits.length - 1; i >= 0; i--) { const h = G.hits[i]; if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) return h; } return null; }
cv.addEventListener('click', (e) => { const h = findHit(toLogical(e)); if (h) h.fn(); });
cv.addEventListener('mousemove', (e) => { cv.style.cursor = findHit(toLogical(e)) ? 'pointer' : 'default'; });
function togglePanel(id) {
  const p = document.getElementById(id), open = !p.classList.contains('open');
  closePanels(); if (open) { p.classList.add('open'); refreshLog(); }
}
function closePanels() { document.querySelectorAll('.panel').forEach(p => p.classList.remove('open')); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
function refreshLog() { document.getElementById('logLines').textContent = G.rawLog.length ? G.rawLog.slice(-40).join('\n') : '아직 받은 줄이 없습니다.'; }
document.getElementById('logPlay').addEventListener('click', () => {
  const n = startReplay(document.getElementById('logText').value);
  if (n) closePanels(); else document.getElementById('logInfo').textContent = '재생할 줄이 없습니다.';
});
document.getElementById('logClose').addEventListener('click', closePanels);
document.getElementById('csvClose').addEventListener('click', closePanels);
setInterval(() => { if (document.getElementById('logPanel').classList.contains('open')) refreshLog(); }, 500);
window.addEventListener('resize', resize);

/* 시작 */
window.__nabiya = { CONFIG, G, Serial, buildChart, startGame, update, draw, songBeat, keyHit, keyRelease, handleLine, parseLine, makeSplitter, startReplay, finish, recompute, IMG };
resize(); loadAssets(); recompute(); Serial.auto();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
requestAnimationFrame(frame);
</script>
